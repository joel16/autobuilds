name: Build

on:
  push:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            runs-on: ubuntu-20.04
            artifact: vitasdk-linux
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            artifact: vitasdk-linux-arm64
          - name: macos
            runs-on: macos-12
            artifact: vitasdk-macos
            install-dependencies: brew install autoconf automake libtool
          - name: windows
            runs-on: ubuntu-22.04
            artifact: vitasdk-windows
            cmake-toolchain: -DCMAKE_TOOLCHAIN_FILE=toolchain-x86_64-w64-mingw32.cmake
            extra-packages: g++-mingw-w64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          if [[ "${{ matrix.install-dependencies }}" != "" ]]; then
            eval "${{ matrix.install-dependencies }}"
          else
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo apt-get install -y cmake cmake-data git build-essential autoconf automake libtool texinfo bison flex pkg-config ${{ matrix.extra-packages }}
          fi
      - name: Clone
        run: |
          export REV=dirty-$(git describe --always)
          git clone https://github.com/vitasdk/buildscripts.git
          chmod +x *.sh
      - name: Update config.sub and config.guess
        run: |
          wget -O /home/runner/work/autobuilds/autobuilds/buildscripts/build/libelf_build-prefix/src/libelf_build/config.sub https://git.savannah.gnu.org/cgit/config.git/plain/config.sub
          wget -O /home/runner/work/autobuilds/autobuilds/buildscripts/build/libelf_build-prefix/src/libelf_build/config.guess https://git.savannah.gnu.org/cgit/config.git/plain/config.guess
      - name: Build
        run: |
          cd buildscripts
          git config --global user.email "builds@travis-ci.com"
          git config --global user.name "Travis CI"
          mkdir build
          cd build
          cmake .. ${{ matrix.cmake-toolchain }}
          make -j$(nproc) tarball
      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: buildscripts/build/*.tar.bz2
      - uses: svenstaro/upload-release-action@v2
        if: contains(github.ref,'refs/heads/master')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: buildscripts/build/*.tar.bz2
          overwrite: true
          file_glob: true
          tag: master-${{ matrix.name }}-v2.${{ github.run_number }}
          release_name: master-${{ matrix.name }}-v2.${{ github.run_number }}
